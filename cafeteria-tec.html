<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarkeTec | Menú de vendedor</title>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light sticky-top top-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">MarkeTec</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Abrir navegación">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About us</a></li>
          <li class="nav-item"><a class="nav-link" href="mision-vision.html">Misión y visión</a></li>
          <li class="nav-item"><a class="nav-link" href="mapa.html">Mapa</a></li>
          <li class="nav-item"><a class="nav-link" href="registro-vendedor.html">Registro</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto-vendedor.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-lg-5">
    <div class="app-shell rounded-5 p-3 p-md-4 p-xl-5">
      <section class="hero-card rounded-5 text-white p-4 p-lg-5 mb-4">
        <div class="row align-items-center g-4">
          <div class="col-lg-8">
            <span id="hero-badge" class="badge rounded-pill brand-badge px-3 py-2 mb-3">MENÚ DESTACADO</span>
            <h1 id="titulo" class="display-6 fw-bold mb-3"></h1>
            <p id="hero-descripcion" class="lead mb-0"></p>
          </div>
        </div>
      </section>

      <section id="menu" class="row g-4"></section>
    </div>
  </main>

  <script src="marketec.js"></script>
  <script>
    async function renderVendorMenu() {
      const params = new URLSearchParams(window.location.search);
      const vendorSlug = params.get("vendedor") || "cafeteria-tec";
      const vendors = await loadVendors();
      const vendor = getVendorBySlug(vendors, vendorSlug);

      if (!vendor) {
        document.getElementById("titulo").textContent = "Vendedor no encontrado";
        document.getElementById("hero-descripcion").textContent = "No hay un menú disponible para el vendedor solicitado.";
        return;
      }

      document.title = `MarkeTec | ${vendor.nombre}`;
      document.getElementById("hero-badge").textContent = vendor.heroBadge || "MENÚ DESTACADO";
      document.getElementById("titulo").textContent = vendor.nombre;
      document.getElementById("hero-descripcion").textContent = vendor.heroDescripcion || vendor.descripcion;

      const container = document.getElementById("menu");
      container.innerHTML = "";

      for (const categoria in vendor.menu) {
        const column = document.createElement("div");
        column.className = "col-12 col-xl-6";

        const card = document.createElement("article");
        card.className = "menu-card rounded-4 p-4 h-100";

        const title = document.createElement("div");
        title.className = "d-flex justify-content-between align-items-center gap-3 mb-3";
        title.innerHTML = `
          <div>
            <h2 class="h4 category-title mb-1">${normalizeLabel(categoria)}</h2>
            <p class="text-secondary mb-0">${vendor.menu[categoria].length} opciones registradas</p>
          </div>
          <span class="badge rounded-pill text-bg-light border">${vendor.menu[categoria].length}</span>
        `;
        card.appendChild(title);

        const list = document.createElement("ul");
        list.className = "list-unstyled soft-list mb-0";

        vendor.menu[categoria].forEach((item) => {
          const listItem = document.createElement("li");
          listItem.className = "py-3";
          const detail = getItemDetail(item);

          listItem.innerHTML = `
            <div class="d-flex justify-content-between align-items-start gap-3">
              <div>
                <h3 class="h6 mb-1">${getItemName(item)}</h3>
                ${detail ? `<p class="text-secondary small mb-0">${detail}</p>` : ""}
              </div>
              <span class="price-tag">${formatPrice(item)}</span>
            </div>
          `;
          list.appendChild(listItem);
        });

        card.appendChild(list);
        column.appendChild(card);
        container.appendChild(column);
      }
    }

    renderVendorMenu().catch(() => {
      document.getElementById("titulo").textContent = "No fue posible cargar el menú";
      document.getElementById("hero-descripcion").textContent = "Verifica que el proyecto se esté ejecutando desde un servidor local.";
    });
  </script>
  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
